version: '3.4'

services:
  db:
    image: mysql:9.7.0
    restart: always
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: rest_with_spring_boot
      # cria o usuário automaticamente com senha
      MYSQL_USER: wferdina
      MYSQL_PASSWORD: admin123
    ports:
      - "3308:3306"
    expose:
      - 3306
    networks:
      - wfsystems-network

  rest-with-spring-boot-wfsystems:
    image: willferdinando/rest-with-spring-boot-wfsystems
    build: ./rest-with-spring-boot-and-java
    working_dir: /rest-with-spring-boot-and-java
    restart: always
    environment:
      TZ: America/Sao_Paulo
      SPRING.DATASOURCE.URL: jdbc:mysql://db:3306/rest_with_spring_boot?useTimezone=true&serverTimezone=UTC
      SPRING.DATASOURCE.USERNAME: wferdina
      SPRING.DATASOURCE.PASSWORD: admin123
    command: mvn spring-boot:run
    ports:
      - "80:80"
    depends_on:
      - db
    networks:
      - wfsystems-network

networks:
  wfsystems-network:
    driver: bridge
